server:
  port: 8083

spring:
  application:
    name: board-service

  datasource:
    url: jdbc:mysql://localhost:3306/board_db
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    password: 1216

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
