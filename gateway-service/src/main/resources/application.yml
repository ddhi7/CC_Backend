server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      # Service Discovery를 통한 라우팅 활성화
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # 글로벌 CORS 설정
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # 라우팅 규칙 정의
      routes:
        # Auth Service 라우팅
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/member/**
          filters:
            - name: AuthenticationFilter  # 커스텀 인증 필터

        - id: board-service
          uri: lb://board-service
          predicates:
            - Path=/board/**
          filters:
            - name: AuthenticationFilter

#TODO : JWT 설정
jwt:
  secret:${JWT_SECRET}

#Eureka Client 설정
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
